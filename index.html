<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="صفحة شخصية لنزار محمد عبدالله - طالب ماستر متخصص في تأثير أدوات الذكاء الاصطناعي على تحسين نطق اللغة الفرنسية">
    <meta name="keywords" content="ماستر، ذكاء اصطناعي، اللغة الفرنسية، جامعة طرابلس">
    <meta name="author" content="Nizar Mohammed Abdullah">
    <title>نزار محمد عبدالله | طالب ماستر - الذكاء الاصطناعي واللغة الفرنسية</title>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-dark: #0a0e27;
            --primary-darker: #050812;
            --accent-primary: #00d4ff;
            --accent-secondary: #64b5f6;
            --accent-tertiary: #7c3aed;
            --gold-accent: #ffd700;
            --text-primary: #ffffff;
            --text-secondary: #b0bec5;
            --text-tertiary: #90a4ae;
            --border-light: #1e2d4a;
            --border-medium: #2a3f5f;
            --card-bg: #0f1829;
            --card-hover: #141f3a;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-darker) 0%, var(--primary-dark) 50%, #0d1b3a 100%);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 212, 255, 0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(124, 58, 237, 0.03) 0%, transparent 50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Header & Navigation */
        header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(5, 8, 18, 0.92);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-light);
            z-index: 1000;
            animation: slideDown 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 32px rgba(0, 212, 255, 0.08);
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2.5rem;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }

        .logo:hover {
            filter: drop-shadow(0 0 8px rgba(0, 212, 255, 0.5));
        }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 2.5rem;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            letter-spacing: 0.5px;
        }

        .nav-links a:hover {
            color: var(--accent-primary);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            bottom: -8px;
            right: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        .contact-btn {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: var(--primary-dark);
            padding: 0.75rem 1.8rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: none;
            cursor: pointer;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            box-shadow: 0 8px 20px rgba(0, 212, 255, 0.25);
        }

        .contact-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 212, 255, 0.4);
            filter: brightness(1.1);
        }

        .contact-btn:active {
            transform: translateY(-1px);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--accent-primary);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* Hero Section */
        .hero {
            margin-top: 70px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.05) 0%, rgba(124, 58, 237, 0.03) 100%);
            position: relative;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.15) 0%, transparent 70%);
            top: -200px;
            right: -150px;
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .hero::after {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(124, 58, 237, 0.12) 0%, transparent 70%);
            bottom: -150px;
            left: -100px;
            border-radius: 50%;
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-30px);
            }
        }

        .hero-content {
            max-width: 1000px;
            text-align: center;
            z-index: 1;
            animation: fadeInUp 1s ease-out 0.2s both;
            padding: 2rem;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(40px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 1.5rem;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 50%, var(--accent-tertiary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            font-weight: 800;
            letter-spacing: -1px;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        .hero .subtitle {
            font-size: 1.4rem;
            color: var(--text-secondary);
            margin-bottom: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            animation: fadeInUp 1s ease-out 0.4s both;
        }

        .hero .university {
            font-size: 1rem;
            color: var(--accent-primary);
            margin-bottom: 2.5rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            animation: fadeInUp 1s ease-out 0.5s both;
        }

        .hero-buttons {
            display: flex;
            gap: 1.5rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 3rem;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            color: var(--primary-dark);
            padding: 1.1rem 2.8rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: none;
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 0.5px;
            box-shadow: 0 12px 30px rgba(0, 212, 255, 0.3);
            position: relative;
            overflow: hidden;
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.1);
            transition: left 0.3s ease;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary:hover {
            transform: translateY(-4px);
            box-shadow: 0 18px 50px rgba(0, 212, 255, 0.45);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-primary);
            padding: 1.1rem 2.8rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 700;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid var(--accent-primary);
            cursor: pointer;
            font-size: 1rem;
            letter-spacing: 0.5px;
            position: relative;
            overflow: hidden;
        }

        .btn-secondary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 100%);
            z-index: -1;
            transition: left 0.3s ease;
        }

        .btn-secondary:hover::before {
            left: 0;
        }

        .btn-secondary:hover {
            color: var(--primary-dark);
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0, 212, 255, 0.3);
        }

        /* About Section */
        .about {
            padding: 6rem 2rem;
            max-width: 1300px;
            margin: 0 auto;
        }

        .section-title {
            font-size: 2.8rem;
            margin-bottom: 4rem;
            text-align: center;
            background: linear-gradient(135deg, var(--accent-primary) 0%, var(--accent-secondary) 50%, var(--accent-tertiary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: -1px;
            position: relative;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 80px;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
            border-radius: 2px;
        }

        .about-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            align-items: center;
        }

        .about-text h3 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .about-text p {
            color: var(--text-secondary);
            margin-bottom: 1.8rem;
            line-height: 1.9;
            font-size: 1.05rem;
        }

        .about-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.8rem;
            margin-top: 2.5rem;
        }

        .info-card {
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.08) 0%, rgba(124, 58, 237, 0.05) 100%);
            padding: 1.8rem;
            border-radius: 12px;
            border: 1px solid var(--border-light);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
        }

        .info-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: linear-gradient(180deg, var(--accent-primary), var(--accent-secondary));
            transform: scaleY(0);
            transform-origin: top;
            transition: transform 0.4s ease;
        }

        .info-card:hover::before {
            transform: scaleY(1);
        }

        .info-card:hover {
            transform: translateY(-8px);
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.12) 0%, rgba(124, 58, 237, 0.08) 100%);
            border-color: var(--accent-primary);
            box-shadow: 0 12px 30px rgba(0, 212, 255, 0.15);
        }

        .info-card h4 {
            color: var(--accent-primary);
            margin-bottom: 0.8rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        .info-card p {
            color: var(--text-primary);
            font-size: 1.1rem;
            margin: 0;
            font-weight: 600;
        }

        .about-image {
            position: relative;
            height: 450px;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.12) 0%, rgba(124, 58, 237, 0.08) 100%);
            border-radius: 20px;
            border: 2px solid var(--border-medium);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.15);
        }

        .about-image::before {
            content: '👨‍🎓';
            font-size: 180px;
            animation: float 4s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(0, 212, 255, 0.2));
        }

        /* Research Section */
        .research {
            padding: 6rem 2rem;
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.04) 0%, rgba(124, 58, 237, 0.02) 100%);
        }

        .research-container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .research-content {
            background: linear-gradient(135deg, rgba(15, 24, 41, 0.8) 0%, rgba(20, 31, 58, 0.6) 100%);
            padding: 3.5rem;
            border-radius: 20px;
            border: 1px solid var(--border-medium);
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 212, 255, 0.1);
        }

        .research-content::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0, 212, 255, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            transition: all 0.4s ease;
        }

        .research-content:hover::before {
            top: -30%;
            right: -30%;
        }

        .research-content:hover {
            border-color: var(--accent-primary);
            box-shadow: 0 30px 80px rgba(0, 212, 255, 0.2);
            transform: translateY(-5px);
        }

        .research-title {
            font-size: 1.7rem;
            color: var(--accent-primary);
            margin-bottom: 2rem;
            font-weight: 700;
            line-height: 1.6;
            letter-spacing: -0.5px;
            position: relative;
            z-index: 1;
        }

        .research-description {
            color: var(--text-secondary);
            line-height: 1.95;
            margin-bottom: 2.5rem;
            font-size: 1.08rem;
            position: relative;
            z-index: 1;
        }

        .research-objectives {
            margin-top: 2.5rem;
            padding-top: 2.5rem;
            border-top: 1px solid var(--border-light);
            position: relative;
            z-index: 1;
        }

        .research-objectives h4 {
            color: var(--accent-secondary);
            margin-bottom: 1.5rem;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .objectives-list {
            list-style: none;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.3rem;
        }

        .objectives-list li {
            color: var(--text-secondary);
            padding-left: 2rem;
            position: relative;
            line-height: 1.7;
        }

        .objectives-list li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: var(--accent-primary);
            font-weight: bold;
            font-size: 1.3rem;
        }

        /* Tools Section */
        .tools {
            padding: 6rem 2rem;
            max-width: 1300px;
            margin: 0 auto;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
            margin-top: 4rem;
        }

        .tool-card {
            background: linear-gradient(135deg, rgba(15, 24, 41, 0.9) 0%, rgba(20, 31, 58, 0.7) 100%);
            padding: 2.5rem;
            border-radius: 18px;
            border: 1px solid var(--border-light);
            text-align: center;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
            overflow: hidden;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .tool-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary), var(--accent-tertiary));
            transform: scaleX(0);
            transform-origin: right;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        out infinite;
}

</style>
</head>
<body>

<div style="padding:40px;text-align:center;color:white;">
<h1>Nizar Mohammed Abdullah</h1>
<p>Le site est en cours de mise à jour.</p>
</div>

</body>
</html>
